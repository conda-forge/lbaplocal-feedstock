schema_version: 1

context:
  name: lbaplocal
  version: "0.16.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/52/aa/fd4a02c949da671402029ef739046a3057517aabe6cfb48b84807068d873/lbaplocal-${{ version }}.tar.gz
  sha256: 9b79c90957f76bcad911a5867c61fb85bc7f660b350bb09b1a09eb9628acaaec

build:
  number: 0 # added prmon
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - lb-ap = LbAPLocal.cli.main:app
      - lb-ap-legacy = LbAPLocal.cli.legacy:main
      - lb-ap-run-app = LbAPLocal.cwl.app_runner:main
      - lb-ap-cwl-run = LbAPLocal.cwl.runner:app

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.0
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - lbapcommon >=0.19.0
    - lbprodrun >1.12.2,<2.dev0
    - cwltool >=3.1.20260108
    - cwl-utils >=0.41
    - lbdiracwrappers
    - lbenv
    - apd >=0.6.0
    - click
    - mplhep
    - requests
    - setuptools
    - packaging
    - typer
    - rich
    - textual
    - textual-plotext
    - prompt-toolkit
    - questionary
    # Not Python dependencies: qjs (node as fallback) evaluates CWL expressions,
    # and prmon is run by `lb-prod-run --prmon`.
    - nodejs
    - quickjs
    - prmon

tests:
  - python:
      python_version: ["${{ python_min }}.*", "*"]
      imports:
        - LbAPLocal
      pip_check: true

about:
  summary: Tool to locally run tests for AnalysisProductions
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://gitlab.cern.ch/lhcb-dpa/analysis-productions/lbaplocal
  repository: https://gitlab.cern.ch/lhcb-dpa/analysis-productions/lbaplocal

extra:
  recipe-maintainers:
    - ryuwd
    - AidanWiederhold
    - chrisburr
